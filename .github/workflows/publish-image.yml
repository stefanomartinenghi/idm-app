name: Build and release to local-test

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - pom.xml
      - Dockerfile
      - .dockerignore
      - ".github/workflows/publish-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-idm-app-local-test
  cancel-in-progress: true

jobs:
  build:
    name: Test and build JAR
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test and package
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Prepare immutable JAR artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p image
          cp target/idm-app-*.jar image/idm-app.jar
          cd image
          sha256sum idm-app.jar | tee idm-app.jar.sha256

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: idm-app-jar-${{ github.sha }}
          path: |
            image/idm-app.jar
            image/idm-app.jar.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish image and promote local-test
    needs: build
    runs-on:
      - self-hosted
      - idm-local
    timeout-minutes: 20
    env:
      IMAGE_REPOSITORY: localhost:5001/idm-app
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Download tested JAR
        uses: actions/download-artifact@v8
        with:
          name: idm-app-jar-${{ github.sha }}
          path: image

      - name: Verify JAR integrity
        shell: bash
        run: |
          set -euo pipefail
          cd image
          sha256sum --check idm-app.jar.sha256

      - name: Verify local delivery services
        shell: bash
        run: |
          set -euo pipefail
          docker info >/dev/null
          curl --fail --silent --show-error http://localhost:5001/v2/ >/dev/null

      - name: Build docker image from tested JAR
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${IMAGE_REPOSITORY}:${IMAGE_TAG}" \
            .

      - name: Push immutable image
        shell: bash
        run: docker push "${IMAGE_REPOSITORY}:${IMAGE_TAG}"

      - name: Verify image in registry
        shell: bash
        run: |
          set -euo pipefail
          curl \
            --fail \
            --silent \
            --show-error \
            --header "Accept: application/vnd.oci.image.manifest.v1+json" \
            "http://localhost:5001/v2/idm-app/manifests/${IMAGE_TAG}" \
            >/dev/null

          {
            echo "### Published image"
            echo '```text'
            echo "${IMAGE_REPOSITORY}:${IMAGE_TAG}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Create GitHub App token for idm-gitops
        id: gitops-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: idm-gitops
          permission-contents: write

      - name: Checkout GitOps repository
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/idm-gitops
          ref: main
          token: ${{ steps.gitops-token.outputs.token }}
          path: idm-gitops

      - name: Update local-test image
        shell: bash
        run: |
          set -euo pipefail
          overlay="idm-gitops/apps/idm/overlays/local-test/kustomization.yaml"

          sed -i -E \
            "s/^([[:space:]]*newTag:).*/\1 ${IMAGE_TAG}/" \
            "${overlay}"

          grep -q "newTag: ${IMAGE_TAG}" "${overlay}"
          kubectl kustomize idm-gitops/apps/idm/overlays/local-test >/dev/null

      - name: Commit local-test promotion
        shell: bash
        env:
          APP_SLUG: ${{ steps.gitops-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          cd idm-gitops

          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git add apps/idm/overlays/local-test/kustomization.yaml

          if git diff --cached --quiet; then
            echo "local-test already references ${IMAGE_TAG}"
            exit 0
          fi

          git commit -m "Deploy idm-app ${IMAGE_TAG} to local-test"
          git push origin main

      - name: Remove local image files
        if: always()
        shell: bash
        run: |
          docker image rm "${IMAGE_REPOSITORY}:${IMAGE_TAG}" >/dev/null 2>&1 || true
          rm -f -- image/idm-app.jar image/idm-app.jar.sha256
          rmdir -- image 2>/dev/null || true
