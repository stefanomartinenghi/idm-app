name: Promote tagged image to local-qual

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vMAJOR.MINOR.PATCH tag to promote
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: promote-idm-app-local-qual
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    outputs:
      image-tag: ${{ steps.release.outputs.image-tag }}
      release-version: ${{ steps.release.outputs.release-version }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Resolve and validate release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use the vMAJOR.MINOR.PATCH format" >&2
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          image_tag="$(git rev-list -n 1 "${RELEASE_TAG}")"

          if [[ ! "${image_tag}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unable to resolve ${RELEASE_TAG} to a commit" >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "${image_tag}" origin/main; then
            echo "Tag ${RELEASE_TAG} does not reference a commit on main" >&2
            exit 1
          fi

          echo "image-tag=${image_tag}" >> "${GITHUB_OUTPUT}"
          echo "release-version=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"

          {
            echo "### Validated release"
            echo "- Version: \`${RELEASE_TAG}\`"
            echo "- Commit: \`${image_tag}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  promote:
    name: Promote existing image to local-qual
    needs: validate-tag
    runs-on:
      - self-hosted
      - idm-local
    environment: local-qual
    timeout-minutes: 20
    env:
      IMAGE_REPOSITORY: localhost:5001/idm-app
      IMAGE_TAG: ${{ needs.validate-tag.outputs.image-tag }}
      RELEASE_VERSION: ${{ needs.validate-tag.outputs.release-version }}

    steps:
      - name: Verify immutable image in local registry
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            http://localhost:5001/v2/ \
            >/dev/null

          for attempt in $(seq 1 30); do
            if curl \
              --fail \
              --silent \
              --show-error \
              --header "Accept: application/vnd.oci.image.manifest.v1+json" \
              "http://localhost:5001/v2/idm-app/manifests/${IMAGE_TAG}" \
              >/dev/null; then
              exit 0
            fi

            if [[ "${attempt}" -eq 30 ]]; then
              echo "Image ${IMAGE_REPOSITORY}:${IMAGE_TAG} does not exist" >&2
              exit 1
            fi

            echo "Image not available yet; retrying in 10 seconds"
            sleep 10
          done

      - name: Create GitHub App token for idm-gitops
        id: gitops-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: idm-gitops
          permission-contents: write

      - name: Checkout GitOps repository
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/idm-gitops
          ref: main
          token: ${{ steps.gitops-token.outputs.token }}
          path: idm-gitops

      - name: Update local-qual desired state
        shell: bash
        run: |
          set -euo pipefail
          overlay="idm-gitops/apps/idm/overlays/local-qual/kustomization.yaml"
          applicationset="idm-gitops/argocd/applicationset.yaml"

          sed -i -E \
            "s/^([[:space:]]*newTag:).*/\1 ${IMAGE_TAG}/" \
            "${overlay}"

          if ! grep -q "^[[:space:]]*- environment: local-qual$" "${applicationset}"; then
            python3 - "${applicationset}" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          content = path.read_text(encoding="utf-8")
          anchor = (
              "          - environment: local-test\n"
              "            namespace: idm-test\n"
          )
          local_qual = (
              "          - environment: local-qual\n"
              "            namespace: idm-qual\n"
          )

          if anchor not in content:
              raise SystemExit("local-test ApplicationSet entry not found")

          path.write_text(
              content.replace(anchor, anchor + local_qual, 1),
              encoding="utf-8",
          )
          PY
          fi

          grep -q "newTag: ${IMAGE_TAG}" "${overlay}"
          grep -q "^[[:space:]]*- environment: local-qual$" "${applicationset}"
          kubectl kustomize idm-gitops/apps/idm/overlays/local-qual >/dev/null
          kubectl apply \
            --dry-run=server \
            --filename "${applicationset}" \
            >/dev/null

      - name: Commit local-qual promotion
        shell: bash
        env:
          APP_SLUG: ${{ steps.gitops-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          cd idm-gitops

          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git add \
            apps/idm/overlays/local-qual/kustomization.yaml \
            argocd/applicationset.yaml

          if git diff --cached --quiet; then
            echo "local-qual already references ${IMAGE_TAG}"
            exit 0
          fi

          git commit \
            -m "Promote idm-app ${RELEASE_VERSION} (${IMAGE_TAG}) to local-qual"
          git pull --rebase origin main
          git push origin main

      - name: Write promotion summary
        shell: bash
        run: |
          {
            echo "### Promoted existing image to local-qual"
            echo "- Version: \`${RELEASE_VERSION}\`"
            echo "- Image: \`${IMAGE_REPOSITORY}:${IMAGE_TAG}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
